<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - TrustFix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🔧 TrustFix</a>
            <ul class="nav-links">
                <li><a href="#" id="welcomeText">Dashboard</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <h1>Customer Dashboard</h1>
                <p style="color: var(--text-light);">Welcome, <span id="customerName"></span></p>
            </div>

            <!-- Tabs -->
            <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color);">
                <button class="tab-btn active" data-tab="browse" onclick="showTab('browse')">Browse Services</button>
                <button class="tab-btn" data-tab="bookings" onclick="showTab('bookings')">My Bookings</button>
                <button class="tab-btn" data-tab="profile" onclick="showTab('profile')">Profile</button>
            </div>

            <!-- Browse Services Tab -->
            <div id="browseTab" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Find Service Providers</h2>
                    </div>

                    <!-- Search Filters -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; margin-bottom: 2rem;">
                        <div class="form-group" style="margin: 0;">
                            <label for="categoryFilter">Category</label>
                            <select id="categoryFilter">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <label for="cityFilter">City</label>
                            <input type="text" id="cityFilter" placeholder="Enter city">
                        </div>
                        <div style="display: flex; align-items: flex-end;">
                            <button class="btn btn-primary" onclick="searchProviders()">Search</button>
                        </div>
                    </div>

                    <!-- Providers Grid -->
                    <div id="providersGrid" class="providers-grid"></div>
                </div>
            </div>

            <!-- My Bookings Tab -->
            <div id="bookingsTab" class="tab-content hidden">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">My Bookings</h2>
                    </div>
                    <div class="table-container">
                        <table id="bookingsTable">
                            <thead>
                                <tr>
                                    <th>Booking ID</th>
                                    <th>Service</th>
                                    <th>Provider</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content hidden">
                <div class="card">
                    <h2 class="card-title">My Profile</h2>
                    <div id="profileInfo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Book Service Modal -->
    <div id="bookingModal" class="modal hidden" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <h2 style="margin-bottom: 1.5rem;">Book Service</h2>
            <div id="alertBox" class="hidden"></div>
            <form id="bookingForm">
                <input type="hidden" id="selectedProviderId">
                <input type="hidden" id="selectedServiceId">

                <div class="form-group">
                    <label>Provider: <span id="modalProviderName"></span></label>
                </div>

                <div class="form-group">
                    <label for="serviceSelect">Select Service *</label>
                    <select id="serviceSelect" required></select>
                </div>

                <div class="form-group">
                    <label for="problemDescription">Problem Description *</label>
                    <textarea id="problemDescription" required placeholder="Describe your problem in detail"></textarea>
                </div>

                <div class="form-group">
                    <label for="preferredDate">Preferred Date *</label>
                    <input type="date" id="preferredDate" required>
                </div>

                <div class="form-group">
                    <label for="bookingAddress">Address *</label>
                    <textarea id="bookingAddress" required placeholder="Enter service address"></textarea>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number *</label>
                    <input type="tel" id="contactNumber" required placeholder="Enter contact number">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Booking</button>
                    <button type="button" class="btn btn-outline" onclick="closeBookingModal()" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/customer-dashboard.js"></script>
</body>
</html>

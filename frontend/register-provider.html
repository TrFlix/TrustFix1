<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Registration - TrustFix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🔧 TrustFix</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="form-container" style="max-width: 600px;">
        <h2 class="text-center mb-2">Service Provider Registration</h2>
        <p class="text-center mb-2" style="color: var(--text-light);">Join TrustFix and grow your business</p>

        <div id="alertBox" class="hidden"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone_number">Phone Number *</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
            </div>

            <div class="form-group">
                <label for="service_category">Service Category *</label>
                <select id="service_category" name="service_category" required>
                    <option value="">Select Service Category</option>
                    <option value="Electrician">Electrician</option>
                    <option value="Plumber">Plumber</option>
                    <option value="AC Repair">AC Repair</option>
                    <option value="Home Cleaning">Home Cleaning</option>
                    <option value="Carpenter">Carpenter</option>
                    <option value="Painting">Painting</option>
                    <option value="Appliance Repair">Appliance Repair</option>
                    <option value="Computer Repair">Computer Repair</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">Experience (Years) *</label>
                <input type="number" id="experience" name="experience" placeholder="Years of experience" required min="0">
            </div>

            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" name="address" placeholder="Enter your business address" required></textarea>
            </div>

            <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" placeholder="Tell customers about your services and expertise"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>

        <p class="text-center mt-2">
            Already have an account?
            <a href="login.html" style="color: var(--primary-color); font-weight: 600;">Login here</a>
        </p>

        <p class="text-center mt-1">
            Looking for services?
            <a href="register-customer.html" style="color: var(--secondary-color); font-weight: 600;">Register as Customer</a>
        </p>
    </div>

    <script src="js/register-provider.js"></script>
</body>
</html>
